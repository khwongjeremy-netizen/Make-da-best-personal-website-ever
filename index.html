<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTFD-8">
        <meta name ="viewport" content = "width=device-width, initial-scale=1.0">

        <title>Jeremy Wong</title>
        <link rel="stylesheet" href = "dist.css">

    </head>
    <body>
        <header class="bg-[#08080a] text-slate-950 min-h-screen overflow-x-hidden select-none">
            <script type="module" src="http://unpkg.com/@splinetool/viewer@1.9.0/build/spline-viewer.js"></script>
            <div class="relative justify-center items-center flex-col z-20 mb-6 group">
                    <div class=" absolute inset-0 rounded-full bg-blue-500/30 blur-x1 scale-110 opacity-70 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <img src="Images/jeremy.jpg" alt ="Jeremy" class=" z-10 w-36 h-36 rounded-full object-cover border-4 border-blue-400 shadow-lg shadow-purple-500 backdrop-blur-sm ring-2 ring-slate-850/50 transition-all duration-500 group-hover:scale-110 group-hover:border-purple-500 group-hover:backdrop-purple-500"></img.>
            </div>
            <header id ="interactive_header" class="relative flex flex-col h-[600px] w-full items-center justify-center overflow-hidden bg-black">
                <div class ="absolute inset-0 z-0">
                    <spline-viewer  class="z-0" url = "https://my.spline.design/glasslogoanimationforwebsite-3NCblA3Ges2qt4jnZ3kQiGc8/scene.splinecode"></spline-viewer>
                </div>
                    <h1 class="flex space-x-8 justify-center pointer-events-auto w-full text-6xl text-white font-bold drop-shadow-lg" >
                        <span onmouseenter="openDrop('intro', 'general')" id = "intro-dropdown" class="group relative hover:text-blue-400 transition-all duration-500 cursor-pointer">
                            J
                        </span>
                        <span onmouseenter="openDrop('books', 'general')" id ="books-dropdown" class=" group relative hover:text-blue-400 transition-all duration-500 cursor-pointer">
                            E
                        </span>
                        <span  onmouseenter="openDrop('shows', 'general')" id ="shows-dropdown"class="group relative hover:text-blue-400 transition-all duration-500 cursor-pointer">
                            R
                        </span>
                        <span onmouseenter="openDrop('anime' , 'general')" id = "anime-dropdown" class="group relative hover:text-blue-400 transition-all duration-500 cursor-pointer">
                            E
                        </span>
                        <span onmouseenter="openDrop('music', 'general')" id="music-dropdown" class="group relative hover:text-blue-400 transition-all duration-500 cursor-pointer">
                            M
                        </span>
                        <span onmouseenter="openDrop('likes', 'general')" id="likes-dropdown" class="group relative hover:text-blue-400 transition-all duration-500 cursor-pointer">
                            Y
                        </span>
                    </h1>
                    
                    <div onmouseleave="closeDrop('general')" id="general-dropdown" class=" hover:scale-105 hover:text-blue-400 mt-8 w-96 opacity-0 h-0 overflow-hidden transition-all duration-500 bg-slate-950 border-4 border-blue-900 rounded-md p-0 text-white text-xl z-50">
                        <div id="general-inner-content" class = "p-6">

                        </div>
                    </div>
                </div>
        </header>
        <main class="flex flex-col items-center bg-slate-100">
            <div class="bg-slate-400 mb-24 w-[700px] h-[900px] opacity-0 load-in m-24 border-4 border-blue-400 p-6 rounded-lg ">
                <img src="Images/Flowers/Orange_leaf.jpeg" class = "w-full h-full">
            </div>
            <div class="group overflow-hidden bg-slate-400 mt-6 w-[700px] h-[900px] opacity-0 m-24 border-4 border-blue-400 p-6 rounded-lg load-in">
                <img src="Images/Fits/fit3.5.jpeg" onmouseenter ="openDrop('story', 'link-fits')" class="w-full h-full h-auto rounded transition-transform duration-500 group-hover:scale-[1.01]">
            <div class=" border-4 border-blue-400 p-6 bg-slate-400 rounded-lg mt-24 mb-24 w-[700px] h-[500px] opacity-0 load-in">
                <img src="Images/Flowers/orange_flower.jpeg" class="w-full h-full">
            </div>
            <div class=" border-4 border-blue-400 bg-slate-400 p-6 mb-54 w-[700px] h-[1000p] opacity-0 load-in">
                <img src="Images/Fits/fit2.jpeg" class="w-full h-full">
            </div>
        </main>
        <footer class="bg-slate-950 h-96">

        </footer>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
        <script src="./index.js"></script>
    </body>
</html>
